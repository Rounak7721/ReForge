<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!--
    Reforge mark — v3 (final).

    Bowl: two concentric arcs about (18, 10.6), outer r=6 and counter r=2, so
    every arm is exactly 4 thick and the curve stays parallel to itself.

    Strokes: parallelograms on a 0.55 shear, pitch 7.18 (4.68 wide + 2.5 gap).
    The width is 4.68 rather than 4.1 on purpose — a sheared bar's *optical*
    thickness is its horizontal width times cos(atan(0.55)) ≈ 0.876, so
    matching the stem's 4.1 numerically would have rendered the strokes ~12%
    lighter than the letter they belong to.

    The longest stroke doubles as the R's leg. That is the whole idea: three
    parallel bars reducing in length is the product (a structure taken apart),
    and borrowing one of them as the leg makes it a letter rather than a letter
    with decoration next to it.

    Span is x 5.33–26.68 and y 4.6–27.4, so the optical centre is (16, 16) and
    the mark sits square in a tile with no nudge transform.
  -->
  <path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"
        d="M7.5 4.6 H18 A6 6 0 0 1 18 16.6 H7.5 Z
           M11.6 8.6 H18 A2 2 0 0 1 18 12.6 H11.6 Z"/>

  <path fill="currentColor" d="M16.06 16.6 H20.74 L26.68 27.4 H22.0 Z"/>
  <path fill="currentColor" d="M10.695 19.9 H15.375 L19.5 27.4 H14.82 Z"/>
  <path fill="currentColor" d="M5.33 23.2 H10.01 L12.32 27.4 H7.64 Z"/>
</svg>
